name: Auth Github Action
on:
  push:
    branches:
      - main
    paths:
      - "Backend/Auth/**"
      - "package*.json"
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /root/Document/UrlShortner/Backend/Auth
            git pull
            docker rmi authservice:latest
            docker build -f "./dockerfile" --no-cache -t authservice:latest .
            docker save authservice:latest -o authservice.tar
            sudo k3s ctr image import authservice.tar
            kubectl delete deployment authservicedeployment
            kubectl apply -f "./authservicedeployment.yaml"
